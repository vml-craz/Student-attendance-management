<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student Attendance Management System — Login">

    <title>Attendance Manager - Lamp Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            background: #1f1f25;
            overflow: hidden;
            color: white;
        }

        .title {
            text-align: center;
            padding-top: 30px;
            font-size: 50px;
            font-style: italic;
            font-weight: 300;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 120px;
            height: 85vh;
        }

        /* Lamp */

        .lamp-section {
            position: relative;
            width: 300px;
            height: 400px;
        }

        .light {
            position: absolute;
            top: 40px;
            left: -40px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle,
                    rgba(255, 223, 120, 0.5),
                    transparent 70%);
            opacity: 0;
            transition: 0.5s;
        }

        .lamp {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .lamp-top {
            width: 170px;
            height: 90px;
            background: white;
            border-radius: 100px 100px 20px 20px;
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            transition: 0.5s;
        }

        .lamp-stand {
            width: 18px;
            height: 180px;
            background: white;
            position: absolute;
            top: 150px;
            left: 50%;
            transform: translateX(-50%);
        }

        .lamp-base {
            width: 120px;
            height: 20px;
            background: white;
            border-radius: 20px;
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Wire */

        .wire {
            width: 3px;
            height: 120px;
            background: #999;
            position: absolute;
            top: 130px;
            left: 58%;
            cursor: pointer;
            transition: 0.2s;
        }

        .knob {
            width: 20px;
            height: 20px;
            background: #e4b98b;
            border-radius: 50%;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Login Card */

        .login-card {
            width: 420px;
            padding: 40px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);

            opacity: 0;
            transform: translateY(40px) scale(0.9);
            pointer-events: none;

            transition: 0.6s ease;
        }

        .login-card.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .login-brand h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .login-brand p {
            color: #ccc;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .form-control {
            width: 100%;
            padding: 15px;
            border: none;
            outline: none;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 16px;
        }

        .form-control::placeholder {
            color: #ccc;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg,
                    #f6e27a,
                    #d9b650,
                    #f6e27a);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.03);
        }

        .login-error {
            color: #ff7b7b;
            text-align: center;
            margin-bottom: 15px;
        }

        .default-text {
            text-align: center;
            margin-top: 20px;
            color: #ccc;
            font-size: 0.8rem;
        }

        /* Lamp ON */

        body.active .light {
            opacity: 1;
        }

        body.active .lamp-top {
            box-shadow: 0 0 40px rgba(255, 223, 120, 0.9);
        }

        /* Mobile */

        @media(max-width:900px) {
            .container {
                flex-direction: column;
                gap: 30px;
            }

            .title {
                font-size: 38px;
            }

            .login-card {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Lamp -->
        <div class="lamp-section">

            <div class="light"></div>

            <div class="lamp">

                <div class="lamp-top"></div>
                <div class="lamp-stand"></div>
                <div class="lamp-base"></div>

                <!-- Pull Wire -->
                <div class="wire" id="wire">
                    <div class="knob"></div>
                </div>

            </div>
        </div>

        <!-- Login Card -->
        <div class="login-card" id="loginCard">

            <div class="login-brand">
                <div class="brand-icon">📋</div>
                <h1>Attendance Manager</h1>
                <p>Sign in to manage attendance</p>
            </div>

            <div class="login-error" id="loginError"></div>

            <form id="loginForm" autocomplete="off">

                <div class="form-group">
                    <label for="username">Username</label>

                    <input type="text"
                        id="username"
                        class="form-control"
                        placeholder="Enter your username"
                        required
                        autofocus>
                </div>

                <div class="form-group">

                    <label for="password">Password</label>

                    <div class="password-wrapper">

                        <input type="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required>

                        <button type="button"
                            class="password-toggle"
                            id="passwordToggle">

                            👁️

                        </button>

                    </div>
                </div>

                <button type="submit" class="btn">
                    Sign In
                </button>

            </form>

            <p class="default-text">
                Default:
                admin/admin123 |
                teacher/teacher123 |
                STU001/student123
            </p>

        </div>

    </div>

    <!-- Backend API Connection -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

    <script>

        const wire = document.getElementById("wire");
        const loginCard = document.getElementById("loginCard");
        const password = document.getElementById("password");

        let isOn = false;

        // Lamp Pull Effect

        wire.addEventListener("click", () => {

            wire.style.transform = "translateY(20px)";

            setTimeout(() => {
                wire.style.transform = "translateY(0px)";
            }, 200);

            isOn = !isOn;

            if (isOn) {
                document.body.classList.add("active");
                loginCard.classList.add("active");
            } else {
                document.body.classList.remove("active");
                loginCard.classList.remove("active");
            }

        });

    </script>

</body>

</html>
